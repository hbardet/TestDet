[package]
name = "testdet-cli"
version.workspace = true
edition.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1.0"
testdet-core = { path = "../testdet-core" }
tokio = { version = "1", features = ["net", "rt", "time"] }

[dev-dependencies]
insta = { version = "1", features = ["filters"] }
tempfile = "3"
