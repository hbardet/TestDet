id: login
description: Log in and capture the session token.
tags: [auth]
vars:
  email: alice@example.test
request:
  kind: graphql
  # The login endpoint is mounted apart from the data graph in the fixture's
  # mock, so the token exchange is visible as its own request.
  path: /auth/login
  operationName: Login
  query: |
    mutation Login($email: String!, $password: String!) {
      login(email: $email, password: $password) {
        token
        project {
          id
        }
      }
    }
  variables:
    email: "{{var.email}}"
    password: "{{env.E2E_PASSWORD}}"
# `projectId` is captured here as well as in `projects`: the validator accepts a
# `{{session.name}}` only when a login operation captures it, and `projects`
# re-captures the id of the project it actually listed before `projects_detail`
# spends it.
capture:
  token: data.login.token
  projectId: data.login.project.id
