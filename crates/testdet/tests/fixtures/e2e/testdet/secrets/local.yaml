# Declared secrets for the `local` environment. Both carry a `default:`, so the
# fixture validates clean (no W_UNSET_SECRET) and never needs a shell export.
E2E_PASSWORD:
  description: Password the login operation sends.
  default: e2e-password-marker-3f9c
E2E_UNUSED:
  description: Referenced only by the `robot` user's token; never exercised.
  default: e2e-unused-marker-7b21
